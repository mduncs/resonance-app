# Replace DEMO_ROOT with an absolute path to a folder you control before
# loading this config. See the README for a one-line substitution.
MusicFolder = "DEMO_ROOT/Music"
DataFolder = "DEMO_ROOT/NavidromeData"
CacheFolder = "DEMO_ROOT/NavidromeCache"
LogFile = "DEMO_ROOT/Logs/navidrome.log"

Address = "127.0.0.1"
Port = 4534
LogLevel = "info"

DevAutoCreateAdminPassword = "demo"
EnableExternalServices = false
EnableInsightsCollector = false
EnableSharing = false
EnableDownloads = false
EnableUserEditing = false
EnableArtworkUpload = false
EnableLogRedacting = true

Scanner.Schedule = "0"
Scanner.ScanOnStartup = true
Scanner.WatcherWait = "0"
Scanner.FollowSymlinks = true
Scanner.PurgeMissing = "always"
